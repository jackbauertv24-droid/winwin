name: Test Results

on:
  push:
    paths:
      - 'results/*.json'
  workflow_dispatch:
    inputs:
      result_file:
        description: 'Result file to test (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org
          npm install

      - name: Detect new result file
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NEW_FILE=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'results/*.json' | head -1)
            MODIFIED_FILE=$(git diff --name-only HEAD^ HEAD -- 'results/*.json' | head -1)
            FILE_TO_TEST="${NEW_FILE:-$MODIFIED_FILE}"
            echo "file=${FILE_TO_TEST}" >> $GITHUB_OUTPUT
            echo "Detected file: ${FILE_TO_TEST}"
          else
            echo "file=${{ inputs.result_file }}" >> $GITHUB_OUTPUT
          fi

      - name: List available result files
        run: |
          echo "Available result files:"
          ls -la results/marksix-*.json 2>/dev/null || echo "No result files found"

      - name: Run tests
        env:
          TEST_FILE: ${{ steps.detect.outputs.file }}
        run: |
          if [ -n "$TEST_FILE" ]; then
            echo "Testing file: $TEST_FILE"
            node test-results.mjs "$TEST_FILE"
          else
            echo "Testing latest file"
            node test-results.mjs
          fi

      - name: Trigger analysis workflow
        if: success() && steps.detect.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run analyze.yml -f result_file="${{ steps.detect.outputs.file }}"
          echo "Analysis workflow triggered for ${{ steps.detect.outputs.file }}"
